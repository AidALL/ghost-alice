<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2320" viewBox="0 0 1440 2320" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">모델의 판단이 코드로 전달되고 결과가 돌아오는 경로</title>
<desc id="desc">모델은 호스트 도구로 답변 검토를 준비하고 기록합니다. 주장과 원본 출처의 판단, 답변 전체와 목적의 판단을 구분합니다. 호스트는 두 Stop 훅을 독립 호출하며 Ghost-ALICE Autopilot은 승인된 계획에서만 작업을 선택하여 호스트에 반환합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526879"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400;fill:#173249}.edge{fill:none;stroke:#526879;stroke-width:2;marker-end:url(#arrow)}.label{font-size:13px;fill:#40576b;paint-order:stroke;stroke:#f5f8fa;stroke-width:5px;stroke-linejoin:round}</style>
<rect width="1440" height="2320" rx="20" fill="#f5f8fa"/>
<text x="720" y="40" text-anchor="middle" font-size="21">모델의 판단이 코드로 전달되고 결과가 돌아오는 경로</text>
<g id="user"><rect x="390" y="70" width="660" height="65" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="107.5" text-anchor="middle" font-size="14">사용자가 목적·제약·권한을 제공합니다.</text>
</g>
<path id="authority-to-work" class="edge" d="M720,135 V155 H360 V180"/>
<text x="545" y="149" text-anchor="middle" font-size="13" class="label">목적과 권한</text>
<g id="assistant-work"><rect x="75" y="180" width="570" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="360.0" y="218.5" text-anchor="middle" font-size="14">1 · 응답 모델이 승인된 작업을 선택하고</text>
<text x="360.0" y="241.5" text-anchor="middle" font-size="14">필요한 도구 실행을 호스트에 요청합니다.</text>
</g>
<g id="tools"><rect x="795" y="180" width="570" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="1080.0" y="218.5" text-anchor="middle" font-size="14">호스트가 권한을 확인하고 도구를 실행하여</text>
<text x="1080.0" y="241.5" text-anchor="middle" font-size="14">실제 관찰을 응답 모델에 반환합니다.</text>
</g>
<path id="tool-request" class="edge" d="M645,209 H795"/>
<text x="720" y="195" text-anchor="middle" font-size="13" class="label">도구 호출 요청</text>
<path id="tool-result" class="edge" d="M795,242 H645"/>
<text x="720" y="265" text-anchor="middle" font-size="13" class="label">실제 관찰</text>
<path id="observations-to-draft" class="edge" d="M360,270 V330"/>
<g id="assistant-draft"><rect x="40" y="330" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250" y="356" text-anchor="middle" font-size="14">2 · 모델이 원고와 출처 입력을 명시합니다.</text>
<text x="250" y="379" text-anchor="middle" font-size="14">새 출처 기반 설명: 검토 대상 주장을 지정합니다.</text>
<text x="250" y="402" text-anchor="middle" font-size="14">완료 candidate 재사용: 원래 주장 연결을 유지합니다.</text>
</g>
<g id="prepare-host"><rect x="510" y="330" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="371.0" text-anchor="middle" font-size="14">호스트 실행 도구가</text>
<text x="720.0" y="394.0" text-anchor="middle" font-size="14">completion_assessment.py prepare-response 실행</text>
</g>
<g id="review-preparation"><rect x="980" y="330" width="420" height="95" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190" y="371" text-anchor="middle" font-size="14">Core가 정확한 검토 입력을 저장하거나 보존하고</text>
<text x="1190" y="394" text-anchor="middle" font-size="14">내용과 주장 연결 ID를 반환합니다.</text>
</g>
<path id="draft-to-host" class="edge" d="M460,377 H510"/>
<text x="720" y="305" text-anchor="middle" font-size="13" class="label">원고 + 새 주장·출처 또는 원래 candidate</text>
<path id="host-to-preparation" class="edge" d="M930,377 H980"/>
<text x="1190" y="305" text-anchor="middle" font-size="13" class="label">CLI가 인자·파일을 읽음</text>
<path id="prepared-input-return" class="edge" d="M1190,425 V475 H360 V525"/>
<text x="740" y="467" text-anchor="middle" font-size="13" class="label">호스트가 저장 내용 + candidate_reference 반환</text>
<g id="assistant-claim-review"><rect x="75" y="525" width="570" height="110" rx="12" fill="#e2f4ec" stroke="#afc3d1"/>
<text x="360.0" y="562.0" text-anchor="middle" font-size="14">3a · 모델이 각 주장을</text>
<text x="360.0" y="585.0" text-anchor="middle" font-size="14">원본 출처 내용과 비교합니다.</text>
<text x="360.0" y="608.0" text-anchor="middle" font-size="14">판정·출처·이유를 남깁니다.</text>
</g>
<g id="assistant-response-review"><rect x="795" y="525" width="570" height="110" rx="12" fill="#e2f4ec" stroke="#afc3d1"/>
<text x="1080.0" y="562.0" text-anchor="middle" font-size="14">3b · 모델이 주장별 판단을 사용하여</text>
<text x="1080.0" y="585.0" text-anchor="middle" font-size="14">답변 전체를 사용자 목적·제약·</text>
<text x="1080.0" y="608.0" text-anchor="middle" font-size="14">남은 작업과 비교합니다.</text>
</g>
<path id="claims-to-whole-response-review" class="edge" d="M645,580 H795"/>
<text x="720" y="563" text-anchor="middle" font-size="13" class="label">주장별 판단</text>
<path id="both-judgments-to-request" class="edge" d="M1080,635 V685 H250 V735"/>
<g id="assistant-review-request"><rect x="40" y="735" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250.0" y="776.0" text-anchor="middle" font-size="14">모델이 두 판단을 검토 JSON으로 쓰고</text>
<text x="250.0" y="799.0" text-anchor="middle" font-size="14">기록 실행을 요청합니다.</text>
</g>
<g id="record-host"><rect x="510" y="735" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="776.0" text-anchor="middle" font-size="14">호스트 실행 도구가</text>
<text x="720.0" y="799.0" text-anchor="middle" font-size="14">completion_assessment.py record-response 실행</text>
</g>
<g id="review-recording"><rect x="980" y="735" width="420" height="95" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190.0" y="776.0" text-anchor="middle" font-size="14">Core가 연결·출처 무결성을 확인하고</text>
<text x="1190.0" y="799.0" text-anchor="middle" font-size="14">두 판단을 한 트랜잭션으로 저장합니다.</text>
</g>
<path id="judgments-to-host" class="edge" d="M460,782 H510"/>
<text x="490" y="713" text-anchor="middle" font-size="13" class="label">candidate_reference + 검토 JSON 파일</text>
<path id="host-to-recording" class="edge" d="M930,782 H980"/>
<text x="1150" y="713" text-anchor="middle" font-size="13" class="label">CLI가 record_response_review() 호출</text>
<path id="record-result-to-model" class="edge" d="M1190,830 V880 H720 V930"/>
<text x="850" y="869" text-anchor="middle" font-size="13" class="label">지원됨: 호스트가 검토 결과 + response_text 반환</text>
<path id="unsupported-review-to-model" class="edge" d="M1190,830 V850 H205 V900"/>
<text x="380" y="845" text-anchor="middle" class="label">미지원 검토 또는 구체적 선행 조건 오류</text>
<g id="assistant-review-correction"><rect x="40" y="900" width="330" height="120" rx="12" fill="#fff1df" stroke="#afc3d1"/>
<text x="205" y="930" text-anchor="middle" font-size="14">모델이 영향받은 내용을 수정하거나</text>
<text x="205" y="953" text-anchor="middle" font-size="14">미해결 결과를 보고할 원고를 준비합니다.</text>
<text x="205" y="976" text-anchor="middle" font-size="14">변경 없는 업무는 재실행하지 않습니다.</text>
<text x="205" y="999" text-anchor="middle" font-size="14">영향받은 검토 입력만 다시 엽니다.</text>
</g>
<path id="affected-review-return" class="edge" d="M40,955 H20 V377 H40"/>
<g id="assistant-submit"><rect x="390" y="930" width="660" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="968.5" text-anchor="middle" font-size="14">4 · 모델이 호스트 도구 결과로 받은</text>
<text x="720.0" y="991.5" text-anchor="middle" font-size="14">정확한 검토 답변을 제출합니다.</text>
</g>
<g id="assistant-ap-planning"><rect x="40" y="1090" width="420" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250" y="1117" text-anchor="middle" font-size="14">5 · Stop 전에 계획을 수락하는 별도 경로</text>
<text x="250" y="1140" text-anchor="middle" font-size="14">모델이 필요하고 승인된 작업을 정합니다.</text>
<text x="250" y="1163" text-anchor="middle" font-size="14">현재 답변 검토보다 먼저 계획을 수락할 수 있습니다.</text>
</g>
<g id="plan-host"><rect x="510" y="1090" width="420" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720" y="1122" text-anchor="middle" font-size="14">호스트 Python이 register_continuation_plan() 호출</text>
<text x="720" y="1145" text-anchor="middle" font-size="14">작업·기준 참조와</text>
<text x="720" y="1168" text-anchor="middle" font-size="14">실제 승인 참조를 전달</text>
</g>
<g id="ap-plan-store"><rect x="980" y="1090" width="420" height="100" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190.0" y="1122.0" text-anchor="middle" font-size="14">Ghost-ALICE Autopilot이 작업·의존 관계·</text>
<text x="1190.0" y="1145.0" text-anchor="middle" font-size="14">경계·승인 참조를 검증하고</text>
<text x="1190.0" y="1168.0" text-anchor="middle" font-size="14">계획 참조 또는 오류를 반환합니다.</text>
</g>
<path id="approved-plan-request" class="edge" d="M460,1140 H510"/>
<path id="plan-call-to-store" class="edge" d="M930,1140 H980"/>
<path id="submitted-answer-to-stop" class="edge" d="M720,1020 V1050 H30 V1320 H390"/>
<text x="215" y="1295" text-anchor="middle" font-size="13" class="label">제출 답변 + 네이티브 세션</text>
<g id="host-stop-dispatch"><rect x="390" y="1280" width="660" height="85" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="1327.5" text-anchor="middle" font-size="14">네이티브 호스트가 등록된 각 Stop 훅을 독립적으로 호출합니다.</text>
</g>
<path id="host-to-core-guard" class="edge" d="M600,1365 V1420 H365 V1470"/>
<path id="host-to-autopilot-stop" class="edge" d="M840,1365 V1420 H1075 V1470"/>
<g id="core-guard"><rect x="75" y="1470" width="580" height="140" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="365.0" y="1522.0" text-anchor="middle" font-size="14">Core 완료 가드</text>
<text x="365.0" y="1545.0" text-anchor="middle" font-size="14">assess_native_completion() 호출 후</text>
<text x="365.0" y="1568.0" text-anchor="middle" font-size="14">허용 또는 구체적 거부 사유 반환</text>
</g>
<g id="ap-adapter"><rect x="785" y="1470" width="580" height="140" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1075" y="1501" text-anchor="middle" font-size="14">Ghost-ALICE Autopilot Stop 어댑터</text>
<text x="1075" y="1524" text-anchor="middle" font-size="14">같은 Core 평가 API를 호출합니다.</text>
<text x="1075" y="1547" text-anchor="middle" font-size="14">Core가 선택한 완료 근거만 새로 접수하고</text>
<text x="1075" y="1570" text-anchor="middle" font-size="14">적격한 기존 인증 근거를 적용·재사용한 뒤</text>
<text x="1075" y="1593" text-anchor="middle" font-size="14">수락된 계획에서 준비된 작업을 선택합니다.</text>
</g>
<path id="stored-plan-to-autopilot" class="edge" d="M1400,1140 H1420 V1440 H1220 V1470"/>
<text x="1240" y="1385" text-anchor="middle" font-size="13" class="label">Stop에서 읽을 승인 계획 보존</text>
<path id="guard-result-to-host" class="edge" d="M365,1610 V1690 H590 V1740"/>
<text x="355" y="1665" text-anchor="middle" font-size="13" class="label">허용 또는 구체적 거부</text>
<path id="autopilot-result-to-host" class="edge" d="M1075,1610 V1690 H850 V1740"/>
<text x="1100" y="1665" text-anchor="middle" font-size="13" class="label">기록 상태 + 선택적 작업 요청</text>
<g id="host-delivery"><rect x="240" y="1740" width="960" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720" y="1783.5" text-anchor="middle" font-size="14">호스트가 각 훅의 결과를 받습니다.</text>
<text x="720" y="1806.5" text-anchor="middle" font-size="14">호스트가 훅이 식별한 대화에 피드백을 전달할 수 있습니다.</text>
</g>
<g id="host-feedback-to-assistant">
<path id="host-diagnostic-to-assistant" class="edge" d="M590,1840 V1860 H365 V1900"/>
<path id="host-task-to-assistant" class="edge" d="M850,1840 V1860 H1075 V1900"/>
</g>
<text x="365" y="1884" text-anchor="middle" class="label">구체적 진단</text>
<text x="1075" y="1884" text-anchor="middle" class="label">승인된 작업 요청</text>
<g id="next-response-model">
<g id="next-response-diagnostic-model"><rect x="40" y="1900" width="650" height="160" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="365" y="1925" text-anchor="middle" font-size="14">호스트가 진단을 전달하고, 요청된 답변 또는</text>
<text x="365" y="1948" text-anchor="middle" font-size="14">승인된 후속 작업에 정정이 필요하면,</text>
<text x="365" y="1971" text-anchor="middle" font-size="14">해당 대화의 다음 응답 모델이 진단에 명시된</text>
<text x="365" y="1994" text-anchor="middle" font-size="14">기록 오류를 고치거나 원본 근거가 지지하지 않는</text>
<text x="365" y="2017" text-anchor="middle" font-size="14">주장을 수정·철회합니다.</text>
<text x="365" y="2040" text-anchor="middle" font-size="14">진단 수신 자체는 업무 재실행 지시가 아닙니다.</text>
</g>
<g id="next-response-approved-model"><rect x="750" y="1900" width="650" height="160" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="1075" y="1927" text-anchor="middle" font-size="14">호스트가 승인된 작업 요청을 전달하면,</text>
<text x="1075" y="1950" text-anchor="middle" font-size="14">해당 대화의 다음 응답 모델이 저장된 경계와</text>
<text x="1075" y="1973" text-anchor="middle" font-size="14">기준 안에서 허용된 도구 호출을 선택합니다.</text>
<text x="1075" y="1996" text-anchor="middle" font-size="14">배정은 새 권한을 만들거나 업무 실행·전체 완료를</text>
<text x="1075" y="2019" text-anchor="middle" font-size="14">증명하지 않습니다.</text>
</g>
</g>
<text x="720" y="2110" text-anchor="middle" font-size="15">초록색 상자는 모델의 서로 다른 두 판단입니다. 원자적 저장은 어느 판단도 대신하지 않습니다.</text>
<text x="720" y="2133" text-anchor="middle" font-size="15">지원되는 답변은 미완료 작업을 정직하게 보고할 수 있습니다. 근거가 있는 필수 조건만 충족 상태가 됩니다.</text>
<text x="720" y="2156" text-anchor="middle" font-size="15">아키텍처의 번호별 설명에서 실제 값과 API를 확인합니다. 기록이 사용자 권한을 만들지는 않습니다.</text>
<text x="720" y="2179" text-anchor="middle" font-size="15">설명은 새 완료 근거를 만들지 않으며, 적격한 기존 근거와 승인 계획은 계속 사용할 수 있습니다.</text>
<path id="authorized-work-to-planning" class="edge" d="M75,225 H10 V1140 H40"/>
<text x="250" y="1080" text-anchor="middle" class="label">현재 권한과 승인된 작업 범위</text>
<path id="plan-admission-to-model" class="edge" d="M1190,1190 V1230 H250 V1190"/>
<text x="720" y="1221" text-anchor="middle" class="label">호스트가 계획 수락 또는 구체적 오류 반환</text>
</svg>
