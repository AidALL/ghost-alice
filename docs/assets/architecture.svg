<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2320" viewBox="0 0 1440 2320" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How model decisions reach code, and how results return</title>
<desc id="desc">The model uses host tools to prepare and record its answer review. Claim versus original-source judgment and whole-response versus objective judgment remain separate. The host independently invokes two Stop hooks; Ghost-ALICE Autopilot selects only previously approved tasks and returns their request to the host.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526879"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400;fill:#173249}.edge{fill:none;stroke:#526879;stroke-width:2;marker-end:url(#arrow)}.label{font-size:13px;fill:#40576b;paint-order:stroke;stroke:#f5f8fa;stroke-width:5px;stroke-linejoin:round}</style>
<rect width="1440" height="2320" rx="20" fill="#f5f8fa"/>
<text x="720" y="40" text-anchor="middle" font-size="21">How model decisions reach code, and how results return</text>
<g id="user"><rect x="390" y="70" width="660" height="65" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="107.5" text-anchor="middle" font-size="14">The user supplies the objective, constraints and permission.</text>
</g>
<path id="authority-to-work" class="edge" d="M720,135 V155 H360 V180"/>
<text x="545" y="149" text-anchor="middle" font-size="13" class="label">Objective and authority</text>
<g id="assistant-work"><rect x="75" y="180" width="570" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="360.0" y="218.5" text-anchor="middle" font-size="14">1 · The responding model selects authorized work</text>
<text x="360.0" y="241.5" text-anchor="middle" font-size="14">and asks the host to run the required tools.</text>
</g>
<g id="tools"><rect x="795" y="180" width="570" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="1080.0" y="218.5" text-anchor="middle" font-size="14">The host enforces tool permission, executes calls</text>
<text x="1080.0" y="241.5" text-anchor="middle" font-size="14">and returns their actual observations to the model.</text>
</g>
<path id="tool-request" class="edge" d="M645,209 H795"/>
<text x="720" y="195" text-anchor="middle" font-size="13" class="label">Requested tool calls</text>
<path id="tool-result" class="edge" d="M795,242 H645"/>
<text x="720" y="265" text-anchor="middle" font-size="13" class="label">Actual observations</text>
<path id="observations-to-draft" class="edge" d="M360,270 V330"/>
<g id="assistant-draft"><rect x="40" y="330" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250" y="356" text-anchor="middle" font-size="14">2 · The model identifies the draft and source inputs.</text>
<text x="250" y="379" text-anchor="middle" font-size="14">New source-backed explanation: explicit claims.</text>
<text x="250" y="402" text-anchor="middle" font-size="14">Completion-candidate reuse: original bindings.</text>
</g>
<g id="prepare-host"><rect x="510" y="330" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="371.0" text-anchor="middle" font-size="14">Host execution tool runs</text>
<text x="720.0" y="394.0" text-anchor="middle" font-size="14">completion_assessment.py prepare-response</text>
</g>
<g id="review-preparation"><rect x="980" y="330" width="420" height="95" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190" y="371" text-anchor="middle" font-size="14">Core saves or retains exact review inputs</text>
<text x="1190" y="394" text-anchor="middle" font-size="14">and returns their contents and binding IDs.</text>
</g>
<path id="draft-to-host" class="edge" d="M460,377 H510"/>
<text x="720" y="305" text-anchor="middle" font-size="13" class="label">Draft + new claims/sources or original candidate</text>
<path id="host-to-preparation" class="edge" d="M930,377 H980"/>
<text x="1190" y="305" text-anchor="middle" font-size="13" class="label">CLI reads arguments and files</text>
<path id="prepared-input-return" class="edge" d="M1190,425 V475 H360 V525"/>
<text x="740" y="467" text-anchor="middle" font-size="13" class="label">Host returns saved contents + candidate_reference</text>
<g id="assistant-claim-review"><rect x="75" y="525" width="570" height="110" rx="12" fill="#e2f4ec" stroke="#afc3d1"/>
<text x="360.0" y="562.0" text-anchor="middle" font-size="14">3a · The model compares each claim</text>
<text x="360.0" y="585.0" text-anchor="middle" font-size="14">with original source contents.</text>
<text x="360.0" y="608.0" text-anchor="middle" font-size="14">It gives a verdict, sources and reason.</text>
</g>
<g id="assistant-response-review"><rect x="795" y="525" width="570" height="110" rx="12" fill="#e2f4ec" stroke="#afc3d1"/>
<text x="1080.0" y="562.0" text-anchor="middle" font-size="14">3b · The model uses those judgments</text>
<text x="1080.0" y="585.0" text-anchor="middle" font-size="14">to compare the whole answer with the</text>
<text x="1080.0" y="608.0" text-anchor="middle" font-size="14">user objective, constraints and remaining work.</text>
</g>
<path id="claims-to-whole-response-review" class="edge" d="M645,580 H795"/>
<text x="720" y="563" text-anchor="middle" font-size="13" class="label">Individual judgments</text>
<path id="both-judgments-to-request" class="edge" d="M1080,635 V685 H250 V735"/>
<g id="assistant-review-request"><rect x="40" y="735" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250.0" y="776.0" text-anchor="middle" font-size="14">The model writes the two judgments</text>
<text x="250.0" y="799.0" text-anchor="middle" font-size="14">as the review JSON and requests recording.</text>
</g>
<g id="record-host"><rect x="510" y="735" width="420" height="95" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="776.0" text-anchor="middle" font-size="14">Host execution tool runs</text>
<text x="720.0" y="799.0" text-anchor="middle" font-size="14">completion_assessment.py record-response</text>
</g>
<g id="review-recording"><rect x="980" y="735" width="420" height="95" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190.0" y="776.0" text-anchor="middle" font-size="14">Core validates bindings and source integrity,</text>
<text x="1190.0" y="799.0" text-anchor="middle" font-size="14">then stores both judgments in one transaction.</text>
</g>
<path id="judgments-to-host" class="edge" d="M460,782 H510"/>
<text x="490" y="713" text-anchor="middle" font-size="13" class="label">candidate_reference + review JSON file</text>
<path id="host-to-recording" class="edge" d="M930,782 H980"/>
<text x="1150" y="713" text-anchor="middle" font-size="13" class="label">CLI calls record_response_review()</text>
<path id="record-result-to-model" class="edge" d="M1190,830 V880 H720 V930"/>
<text x="850" y="869" text-anchor="middle" font-size="13" class="label">Supported: host returns review + response_text</text>
<path id="unsupported-review-to-model" class="edge" d="M1190,830 V850 H205 V900"/>
<text x="380" y="845" text-anchor="middle" class="label">Unsupported review or named prerequisite error</text>
<g id="assistant-review-correction"><rect x="40" y="900" width="330" height="120" rx="12" fill="#fff1df" stroke="#afc3d1"/>
<text x="205" y="930" text-anchor="middle" font-size="14">The model corrects affected content or</text>
<text x="205" y="953" text-anchor="middle" font-size="14">drafts an honest unresolved result.</text>
<text x="205" y="976" text-anchor="middle" font-size="14">It preserves unchanged business work.</text>
<text x="205" y="999" text-anchor="middle" font-size="14">Reopen only affected review inputs.</text>
</g>
<path id="affected-review-return" class="edge" d="M40,955 H20 V377 H40"/>
<g id="assistant-submit"><rect x="390" y="930" width="660" height="90" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="968.5" text-anchor="middle" font-size="14">4 · The model submits the exact reviewed answer</text>
<text x="720.0" y="991.5" text-anchor="middle" font-size="14">returned by Core through the host tool result.</text>
</g>
<g id="assistant-ap-planning"><rect x="40" y="1090" width="420" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="250" y="1117" text-anchor="middle" font-size="14">5 · Separate plan admission before Stop:</text>
<text x="250" y="1140" text-anchor="middle" font-size="14">the model identifies needed approved tasks.</text>
<text x="250" y="1163" text-anchor="middle" font-size="14">Current answer review may follow admission.</text>
</g>
<g id="plan-host"><rect x="510" y="1090" width="420" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720" y="1122" text-anchor="middle" font-size="14">Host Python calls register_continuation_plan()</text>
<text x="720" y="1145" text-anchor="middle" font-size="14">with tasks, criterion references</text>
<text x="720" y="1168" text-anchor="middle" font-size="14">and actual approval references.</text>
</g>
<g id="ap-plan-store"><rect x="980" y="1090" width="420" height="100" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1190.0" y="1122.0" text-anchor="middle" font-size="14">Ghost-ALICE Autopilot validates tasks,</text>
<text x="1190.0" y="1145.0" text-anchor="middle" font-size="14">dependencies, boundaries and approval references;</text>
<text x="1190.0" y="1168.0" text-anchor="middle" font-size="14">it returns an admitted plan reference or error.</text>
</g>
<path id="approved-plan-request" class="edge" d="M460,1140 H510"/>
<path id="plan-call-to-store" class="edge" d="M930,1140 H980"/>
<path id="submitted-answer-to-stop" class="edge" d="M720,1020 V1050 H30 V1320 H390"/>
<text x="215" y="1295" text-anchor="middle" font-size="13" class="label">Submitted answer + native session</text>
<g id="host-stop-dispatch"><rect x="390" y="1280" width="660" height="85" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720.0" y="1327.5" text-anchor="middle" font-size="14">The native host invokes each registered Stop hook independently.</text>
</g>
<path id="host-to-core-guard" class="edge" d="M600,1365 V1420 H365 V1470"/>
<path id="host-to-autopilot-stop" class="edge" d="M840,1365 V1420 H1075 V1470"/>
<g id="core-guard"><rect x="75" y="1470" width="580" height="140" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="365.0" y="1522.0" text-anchor="middle" font-size="14">Core completion guard</text>
<text x="365.0" y="1545.0" text-anchor="middle" font-size="14">calls assess_native_completion()</text>
<text x="365.0" y="1568.0" text-anchor="middle" font-size="14">and returns allow or a named rejection.</text>
</g>
<g id="ap-adapter"><rect x="785" y="1470" width="580" height="140" rx="12" fill="#eaf0f7" stroke="#afc3d1"/>
<text x="1075" y="1501" text-anchor="middle" font-size="14">Ghost-ALICE Autopilot Stop adapter</text>
<text x="1075" y="1524" text-anchor="middle" font-size="14">calls the same Core assessment API.</text>
<text x="1075" y="1547" text-anchor="middle" font-size="14">Publish new proof only when Core selects it;</text>
<text x="1075" y="1570" text-anchor="middle" font-size="14">apply or reuse eligible authenticated publications;</text>
<text x="1075" y="1593" text-anchor="middle" font-size="14">select ready tasks from the admitted plan.</text>
</g>
<path id="stored-plan-to-autopilot" class="edge" d="M1400,1140 H1420 V1440 H1220 V1470"/>
<text x="1240" y="1385" text-anchor="middle" font-size="13" class="label">Admitted plan retained for Stop</text>
<path id="guard-result-to-host" class="edge" d="M365,1610 V1690 H590 V1740"/>
<text x="355" y="1665" text-anchor="middle" font-size="13" class="label">Allow or named rejection</text>
<path id="autopilot-result-to-host" class="edge" d="M1075,1610 V1690 H850 V1740"/>
<text x="1100" y="1665" text-anchor="middle" font-size="13" class="label">Recording status + optional task request</text>
<g id="host-delivery"><rect x="240" y="1740" width="960" height="100" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="720" y="1783.5" text-anchor="middle" font-size="14">The host receives each hook result.</text>
<text x="720" y="1806.5" text-anchor="middle" font-size="14">The host may deliver feedback to the hook’s identified conversation.</text>
</g>
<g id="host-feedback-to-assistant">
<path id="host-diagnostic-to-assistant" class="edge" d="M590,1840 V1860 H365 V1900"/>
<path id="host-task-to-assistant" class="edge" d="M850,1840 V1860 H1075 V1900"/>
</g>
<text x="365" y="1884" text-anchor="middle" class="label">Named diagnostic</text>
<text x="1075" y="1884" text-anchor="middle" class="label">Approved task request</text>
<g id="next-response-model">
<g id="next-response-diagnostic-model"><rect x="40" y="1900" width="650" height="160" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="365" y="1925" text-anchor="middle" font-size="14">If the host delivers a diagnostic and a correction is needed</text>
<text x="365" y="1948" text-anchor="middle" font-size="14">for the requested answer or an approved dependent task,</text>
<text x="365" y="1971" text-anchor="middle" font-size="14">that conversation’s next response model fixes</text>
<text x="365" y="1994" text-anchor="middle" font-size="14">the identified record error, or revises or withdraws</text>
<text x="365" y="2017" text-anchor="middle" font-size="14">a claim unsupported by the original evidence.</text>
<text x="365" y="2040" text-anchor="middle" font-size="14">Receiving a diagnostic does not direct a business rerun.</text>
</g>
<g id="next-response-approved-model"><rect x="750" y="1900" width="650" height="160" rx="12" fill="#fff" stroke="#afc3d1"/>
<text x="1075" y="1927" text-anchor="middle" font-size="14">If the host delivers an approved task request,</text>
<text x="1075" y="1950" text-anchor="middle" font-size="14">that conversation’s next response model chooses</text>
<text x="1075" y="1973" text-anchor="middle" font-size="14">permitted tools within its stored boundary and criteria.</text>
<text x="1075" y="1996" text-anchor="middle" font-size="14">Dispatch grants no new permission and proves</text>
<text x="1075" y="2019" text-anchor="middle" font-size="14">neither execution nor whole-work completion.</text>
</g>
</g>
<text x="720" y="2110" text-anchor="middle" font-size="15">The green boxes are two model judgments. Atomic storage performs neither judgment.</text>
<text x="720" y="2133" text-anchor="middle" font-size="15">A supported answer can honestly report unfinished work. Only supported required criteria can become met.</text>
<text x="720" y="2156" text-anchor="middle" font-size="15">The numbered architecture sections explain exact values and APIs. User permission is never created by a record.</text>
<text x="720" y="2179" text-anchor="middle" font-size="15">Explanations create no new completion proof; eligible prior proof and approved plans may still be used.</text>
<path id="authorized-work-to-planning" class="edge" d="M75,225 H10 V1140 H40"/>
<text x="250" y="1080" text-anchor="middle" class="label">Current authority and approved task scope</text>
<path id="plan-admission-to-model" class="edge" d="M1190,1190 V1230 H250 V1190"/>
<text x="720" y="1221" text-anchor="middle" class="label">Host returns plan admission or a named error</text>
</svg>
