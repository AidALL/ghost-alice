name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  context-gateway:
    name: Context gateway (Python 3.14 / zstd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test native gateway and compressed streams
        env:
          PYTHONPATH: _shared
        run: python3 -m unittest -v test_context_gateway test_context_gateway_install test_context_gateway_uninstall test_gateway_judgment test_gateway_participant test_installer_participant test_gateway_installer_faults

  validation:
    name: Public validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Validate public surfaces
        run: python3 scripts/validate_public_surfaces.py

      - name: Validate session gate contract
        run: python3 scripts/check_skill_gate_contract.py

      - name: Run shared unit tests
        run: python3 scripts/run_installer_compat_tests.py --group shared-all

      - name: Install Codex skills for installed-copy terminology scan
        env:
          HOME: ${{ runner.temp }}/ghost-alice-ci-home
        run: |
          mkdir -p "$HOME"
          bash ./install.sh --platform codex --skip-source-health

      - name: Run script unit tests
        env:
          GHOST_ALICE_INSTALLED_SKILLS_DIR: ${{ runner.temp }}/ghost-alice-ci-home/.agents/skills
        run: python3 scripts/run_installer_compat_tests.py --group scripts-all

      - name: Validate platform adapters
        run: python3 scripts/validate_platform_adapters.py
