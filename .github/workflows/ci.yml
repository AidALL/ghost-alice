name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-junction-upgrade:
    name: Windows junction upgrade (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Windows pseudoterminal for the record-move prompt
        run: python -m pip install pywinpty
      - name: Fetch the reporter's installer and v0.6.0 for retry
        run: git fetch --no-tags --depth=1 origin (Get-Content scripts/tests/_fixtures/junction-installer-commit.txt) tag v0.6.0
      - name: Upgrade and retry through install.cmd and check preserved links
        env:
          PYTHONPATH: "_shared;session-intent-analyzer/scripts"
        run: python -m unittest -v scripts.tests.test_installer_version_handoff.DirectoryLinkUpgradeTests _shared.test_install_transaction_publish.DirectoryLinkCleanupTests scripts.tests.test_uninstall_cleanup.UninstallCleanupTest.test_apply_removes_manifest_junction_without_removing_source_on_windows

  context-gateway:
    name: Context gateway (Python 3.14 / zstd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test native gateway and compressed streams
        env:
          PYTHONPATH: _shared
        run: python3 -m unittest -v test_context_gateway test_context_lifecycle test_context_gateway_install test_context_gateway_uninstall test_gateway_judgment test_gateway_participant test_installer_participant test_gateway_installer_faults

  validation:
    name: Public validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Install zsh for the zsh invocation tests
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Validate public surfaces
        run: python3 scripts/validate_public_surfaces.py

      - name: Validate session gate contract
        run: python3 scripts/check_skill_gate_contract.py

      - name: Run shared unit tests
        run: python3 scripts/run_installer_compat_tests.py --group shared-all

      - name: Install Codex skills for installed-copy contract checks
        env:
          HOME: ${{ runner.temp }}/ghost-alice-ci-home
        run: |
          mkdir -p "$HOME"
          bash ./install.sh --platform codex --local-source --skip-source-health

      - name: Install Claude skills for the Claude installed-copy comparison
        env:
          HOME: ${{ runner.temp }}/ghost-alice-ci-home
        run: bash ./install.sh --platform claude --local-source --skip-source-health

      - name: Install the Codex CLI for the native prompt-input test
        run: npm install -g @openai/codex@0.161.0

      - name: Fetch the earlier installer and official release used by the upgrade tests
        run: git fetch --no-tags --depth=1 origin "$(cat scripts/tests/_fixtures/earlier-installer-commit.txt)" "$(cat scripts/tests/_fixtures/junction-installer-commit.txt)" tag v0.5.1 tag v0.6.0

      - name: Run script unit tests
        env:
          GHOST_ALICE_INSTALLED_SKILLS_DIR: ${{ runner.temp }}/ghost-alice-ci-home/.agents/skills
          GHOST_ALICE_INSTALLED_CLAUDE_DIR: ${{ runner.temp }}/ghost-alice-ci-home/.claude
        run: python3 scripts/run_installer_compat_tests.py --group scripts-all
