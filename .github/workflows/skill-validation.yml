name: Skill Validation

# Ghost-ALICE OS skill catalog consistency validation CI
# .github surfaces manage CI workflows and PR/issue templates.
# Phase 1-5 validation + skill-catalog sync check + entrypoint smoke tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: skill-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check skill-catalog synchronization
        run: |
          python3 scripts/build_catalog.py --check

      - name: Validate skill consistency
        run: |
          python3 scripts/validate_skills.py

      - name: Run entrypoint smoke tests
        run: |
          python3 scripts/validate_entrypoints.py

      - name: Check public surface parity
        run: |
          python3 scripts/validate_public_surfaces.py

      - name: Check Markdown prose wrapping
        run: |
          python3 scripts/check_prose_wrapping.py

      - name: Run the skill script test groups
        # ci.yml runs shared-all and scripts-all; this step runs the other groups of the default run.
        run: |
          python3 scripts/run_installer_compat_tests.py --group merge-companion-core --group session-intent-ledger --group agent-security-scan --group compact-handoff --group skill-evolution --group brainstorm-companion

      - name: Summarize results
        if: always()
        run: |
          echo "## Validation results" >> $GITHUB_STEP_SUMMARY
          mkdir -p .tmp
          python3 scripts/validate_skills.py --json > .tmp/skill-validation-result.json || true
          python3 -c "
          import json
          d = json.load(open('.tmp/skill-validation-result.json'))
          print(f\"- Skill count: {d['skill_count']}\")
          print(f\"- ERROR: {d['error_count']}\")
          print(f\"- WARNING: {d['warning_count']}\")
          " >> $GITHUB_STEP_SUMMARY
